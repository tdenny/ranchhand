<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animal · Ranchhand</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Ranchhand</h1>
    <button id="token-button" type="button" class="link">Set token</button>
  </header>
  <main>
    <p><a href="index.html">&larr; All animals</a></p>
    <p id="status" role="status"></p>

    <section id="profile" hidden>
      <h2 id="profile-title"></h2>
      <dl id="profile-details"></dl>

      <p><a id="edit-link" href="edit.html">Edit animal</a></p>

      <div id="actions">
        <div id="breeding-actions" hidden>
          <h2>Breeding</h2>
          <div class="buttons"></div>
        </div>
        <div id="removal-actions" hidden>
          <h2>Removal</h2>
          <div class="buttons"></div>
        </div>
      </div>
      <form id="action-form" hidden>
        <h3 id="action-title"></h3>
        <label>Date
          <input name="date" type="date" required>
        </label>
        <label id="action-due-field" hidden>Due date (optional)
          <input name="due_date" type="date">
        </label>
        <label>Notes (optional)
          <textarea name="notes" rows="3"></textarea>
        </label>
        <button type="submit">Save</button>
        <button type="button" id="action-cancel" class="link">Cancel</button>
      </form>
      <p id="action-status" role="status"></p>
    </section>

    <section id="events-section" hidden>
      <h2>Add note</h2>
      <form id="event-form">
        <label>Date
          <input name="date" type="date" required>
        </label>
        <label>Notes (optional)
          <textarea name="notes" rows="3"></textarea>
        </label>
        <button type="submit">Add note</button>
        <p id="form-status" role="status"></p>
      </form>

      <h2>Events</h2>
      <p id="events-status" role="status"></p>
      <ul id="event-list"></ul>
    </section>
  </main>
  <script type="module" src="js/animal.js"></script>
</body>
</html>
