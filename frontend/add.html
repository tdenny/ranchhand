<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add animal · Ranchhand</title>
  <link rel="stylesheet" href="node_modules/choices.js/public/assets/styles/choices.min.css">
  <link rel="stylesheet" href="styles.css">
  <!-- Lets js/parent-picker.js use a bare `import "choices.js"`, which Node resolves for the tests. -->
  <script type="importmap">
    { "imports": { "choices.js": "./node_modules/choices.js/public/assets/scripts/choices.mjs" } }
  </script>
</head>
<body>
  <header>
    <h1>Ranchhand</h1>
    <button id="token-button" type="button" class="link">Set token</button>
  </header>
  <main>
    <p><a href="index.html">&larr; All animals</a></p>

    <h2>Add animal</h2>
    <form id="animal-form">
      <label>Number
        <input name="number" required autocomplete="off">
      </label>
      <label>Sex
        <select name="sex" required>
          <option value="female">Female</option>
          <option value="male">Male</option>
        </select>
      </label>
      <label>Status
        <select name="status" required>
          <option value="active">Active</option>
          <option value="deceased">Deceased</option>
          <option value="processed">Processed</option>
          <option value="sold">Sold</option>
        </select>
      </label>
      <label>Date of birth
        <input name="date_of_birth" type="date" required>
      </label>
      <div class="field">
        <label for="sire">Sire</label>
        <select id="sire" name="sire_id"><option value="">None</option></select>
      </div>
      <div class="field">
        <label for="dam">Dam</label>
        <select id="dam" name="dam_id"><option value="">None</option></select>
      </div>
      <label class="check" id="castrated-field" hidden>
        <input name="castrated" type="checkbox">
        Already castrated
      </label>
      <label id="breeding-state-field">Breeding
        <select name="breeding_state">
          <option value="unbred">Not yet bred</option>
          <option value="bred">Bred</option>
          <option value="pregnant">Pregnant</option>
          <option value="open">Open</option>
        </select>
      </label>
      <label id="due-date-field" hidden>Due date (optional)
        <input name="due_date" type="date">
      </label>
      <button type="submit">Add animal</button>
      <p id="form-status" role="status"></p>
    </form>
    <p><a href="external.html">Add an external sire or dam</a></p>
  </main>
  <script type="module" src="js/add.js"></script>
</body>
</html>
