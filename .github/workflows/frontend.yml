name: "Ranchhand frontend tests"

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-2

defaults:
  run:
    shell: bash
    working-directory: frontend

jobs:
  lint-frontend:
    name: "Lint frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  frontend-tests:
    name: "Frontend tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Execute frontend tests
        run: npm test

  deploy-frontend:
    name: "Deploy frontend"
    needs: [lint-frontend, frontend-tests]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          api_base_url="${API_BASE_URL%/}"
          if [[ ! "$api_base_url" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "Repository variable API_BASE_URL must look like https://host (got: '$api_base_url')" >&2
            exit 1
          fi

          out=../.build/frontend
          choices=node_modules/choices.js/public/assets
          mkdir -p "$out/js" "$out/$choices/styles" "$out/$choices/scripts"
          cp ./*.html styles.css "$out/"
          cp js/*.js "$out/js/"
          cp "$choices/styles/choices.min.css" "$out/$choices/styles/"
          cp "$choices/scripts/choices.mjs" "$out/$choices/scripts/"
          printf 'export const API_BASE_URL = "%s";\n' "$api_base_url" > "$out/js/config.js"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        env:
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: |
          aws s3 sync ../.build/frontend "s3://${FRONTEND_BUCKET}" \
            --delete --cache-control "no-cache"
