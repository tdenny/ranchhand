name: "Tests"

on:
  push:
    branches:
      - main
    workflow_dispatch:

jobs:

  unit-tests:
    name: "Unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Execute unit tests
        working-directory: backend
        run: pytest
