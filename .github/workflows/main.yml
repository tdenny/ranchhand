name: "Tests"

on:
  push:
    branches:
      - main
    workflow_dispatch:

jobs:

  unit-tests:
    name: "Unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'

      - name: Install dependencies
        run: |
          pip install .

      - name: Execute unit tests
        run: pytest
