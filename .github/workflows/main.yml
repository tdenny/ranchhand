name: "Ranchhand test and deploy"

on:
  pull_request:
    paths:
      - "infra/**"
      - "backend/src/**"
      - "backend/tests/**"
      - "backend/requirements*.txt"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "backend/src/**"
      - "backend/tests/**"
      - "backend/requirements*.txt"
      - ".github/workflows/**"
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_tf_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
  TF_VAR_github_repository_id: ${{ github.repository_id }}

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    name: "Unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt

      - name: Execute unit tests
        working-directory: backend
        run: pytest

  terraform-plan:
    name: "Terraform Plan"
    needs: unit-tests
    # Fork PRs do not get an OIDC token, so skip them.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build Lambda package
        run: |
          pip install --requirement ../backend/requirements.txt \
                      --target .build/package \
                      --platform manylinux2014_aarch64 \
                      --implementation cp \
                      --python-version 3.13 \
                      --only-binary=:all:
          cp -r ../backend/src/. ./.build/package

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend-config="bucket=${TF_VAR_tf_state_bucket}"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          set -o pipefail
          terraform plan -no-color -lock-timeout=5m | tee plan.txt

      - name: Add plan to job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Terraform plan'
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-apply:
    name: "Terraform Apply"
    needs: unit-tests
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Build Lambda package
        run: |
          pip install --requirement backend/requirements.txt --target infra/.build/package \
            --platform manylinux2014_aarch64 --implementation cp --python-version 3.13 --only-binary=:all:
          cp -r backend/src/. infra/.build/package

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Init
        run: terraform init -backend-config="bucket=${TF_VAR_tf_state_bucket}"

      - name: Validate
        run: terraform validate

      # Apply the exact plan that was just produced, not a fresh one.
      - name: Plan
        run: |
          set -o pipefail
          terraform plan -no-color -lock-timeout=5m -out=tfplan | tee plan.txt

      - name: Add plan to job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Terraform plan'
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        run: terraform apply -no-color -lock-timeout=5m tfplan
